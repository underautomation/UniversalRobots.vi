name: Create release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release-zips:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # One zip per LabVIEW version, with the license agreement and the third-party notices
    - name: Find LabVIEW directories and create zips
      id: create_zips
      run: |
        extra="License.md"
        if [ -f THIRD-PARTY-NOTICES.txt ]; then extra="$extra THIRD-PARTY-NOTICES.txt"; fi
        for dir in LabVIEW_*; do
          if [ -d "$dir" ]; then
            zip -r "UnderAutomation.UniversalRobots_${dir}.zip" "$dir" $extra
          fi
        done

    - name: Create the release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "*.zip"
        bodyFile: "whatsNew.md"
        token: ${{ secrets.GITHUB_TOKEN }}
